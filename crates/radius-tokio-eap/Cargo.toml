[package]
name = "radius-tokio-eap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TLS-tunnelled EAP methods (EAP-TLS, PEAP, EAP-TTLS) for radius-tokio"
keywords = ["radius", "eap", "peap", "eap-tls", "eap-ttls"]
categories = ["network-programming", "authentication"]
# Allow-list of files shipped in the published crate. Examples and
# integration tests are kept in so downstreams can read them via
# `docs.rs` source links and reproduce the eapol_test runs locally.
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
]

[features]
# No default features — methods are opt-in so downstreams that only
# need the auth primitives in `radius-tokio` core pay nothing for
# this crate's wire drivers. The TLS-tunnelled methods all pull
# `radius-tokio/radsec` because they rely on `TlsContext` /
# `TlsConnection` from the core crate's TLS module; EAP-MD5 has
# no extra dependencies.
default = []

# EAP-MD5-Challenge (RFC 3748 §5.4). Bare, untunneled. No MSK / no
# mutual auth — fine for low-stakes wired 802.1X and as a codec
# regression target; use a TLS-tunnelled method for WPA2/3 Enterprise.
eap-md5 = []

# Native (bare) EAP-MSCHAPv2 (EAP type 26,
# `draft-kamath-pppext-eap-mschapv2`). No outer TLS, no MSK (RFC
# 3079 GetMasterKey not wired in). Provided for legacy wired
# 802.1X interoperability; use PEAP / EAP-TTLS for wireless.
eap-mschapv2 = []

# EAP-TLS (RFC 5216 / RFC 9190). Server-authenticated or mutually
# authenticated TLS session whose exporter output (RFC 5705 §4)
# becomes the MSK.
eap-tls = ["radius-tokio/radsec"]

# PEAP v0 / v1 (`draft-josefsson-pppext-eap-tls-eap`, IETF de-facto
# standard). Outer TLS session protects an inner EAP method
# (typically EAP-MSCHAPv2) negotiated over the TLS record stream.
peap = ["radius-tokio/radsec"]

# EAP-TTLS (RFC 5281). Outer TLS session carries inner attribute
# AVPs (PAP / CHAP / MS-CHAP / inner EAP).
eap-ttls = ["radius-tokio/radsec"]

# Umbrella enabling every EAP method this crate ships.
all-methods = ["eap-md5", "eap-mschapv2", "eap-tls", "peap", "eap-ttls"]

# Emit structured `tracing` events for session lifecycle, method
# dispatch decisions, reassembly state, and TLS-tunnel handshake
# completion. Off by default — enabling it pulls in `tracing` and
# wires a `target = "radius_tokio_eap"` per call site so consumers
# can filter the EAP crate independently of the core RADIUS one.
tracing = ["dep:tracing"]

# Export per-event counters (sessions created/completed, Nak
# pivots, fragment overflows, TLS handshakes) via the `metrics`
# facade. Off by default; enabling it pulls in `metrics` and pays
# a counter increment per emit. Stable metric names live in
# [`obs::metrics`](src/obs.rs).
metrics = ["dep:metrics"]

[dependencies]
radius-tokio = { workspace = true, features = ["server"] }
tokio = { workspace = true, default-features = false, features = ["sync"] }
tracing = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net"] }
radius-tokio = { workspace = true, features = ["radsec", "server"] }

[[example]]
name = "peap_mschapv2"
required-features = ["peap"]

[[example]]
name = "multi_method"
required-features = ["peap", "eap-md5"]

[lints]
workspace = true

