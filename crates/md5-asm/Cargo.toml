[package]
name = "md5-asm"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "MD5 block compressor backed by the vendored animetosho/md5-optimisation inline-asm headers, exposed via a thin C++ shim."
# Wrapper code (src/, build.rs) is BSD-2-Clause; vendored upstream
# headers in vendor/ are public-domain / CC0-1.0 per
# https://github.com/animetosho/md5-optimisation/discussions/4.
license = "BSD-2-Clause AND CC0-1.0"
repository = "https://github.com/example/radius-tokio"
keywords = ["md5", "crypto", "hash", "asm", "simd"]
categories = ["cryptography", "no-std"]
readme = "README.md"
# Restrict the package contents to what's actually built or
# referenced. `cargo package` would otherwise pick up everything in
# the crate dir.
include = [
    "src/**/*.rs",
    "src/**/*.cpp",
    "vendor/md5-arm64-asm.h",
    "vendor/md5-x86-asm.h",
    "vendor/LICENSE",
    "build.rs",
    "Cargo.toml",
    "README.md",
]

[lib]
path = "src/lib.rs"

[features]
# Compile the AVX512 single-buffer block compressor
# (`md5_block_avx512` from the vendored animetosho header).
# x86_64-only; the build script silently no-ops on other arches
# so the feature can be enabled unconditionally by a downstream
# `cfg(target_arch = "x86_64")` consumer. Callers must verify
# `is_avx512_supported()` at runtime before invoking the entry
# points.
avx512 = []

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Vendored upstream headers; no need to demand internal docs.
missing_docs = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
