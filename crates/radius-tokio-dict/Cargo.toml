[package]
name = "radius-tokio-dict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed FreeRADIUS dictionary tables for RADIUS attribute encoding/decoding"
build = "build.rs"
# Allow-list of files shipped in the published crate. The dictionary
# corpus under `dictionaries/` is read by `build.rs` at consumer
# build time and must travel with the crate.
include = [
    "src/**/*.rs",
    "build.rs",
    "dictionaries/**",
    "Cargo.toml",
]

[features]
default = ["dict-rfc"]
# IETF / RFC dictionaries (always recommended; small).
dict-rfc = []
# Per-vendor VSA dictionaries; opt in to keep generated code small.
dict-airespace = []
dict-aruba = []
dict-ascend = []
dict-cisco = []
dict-eleven = []
dict-fortinet = []
dict-hp = []
dict-juniper = []
dict-meraki = []
dict-microsoft = []
dict-mikrotik = []
dict-ruckus = []
dict-tplink = []
dict-wispr = []
# Umbrella enabling every vendored vendor dictionary.
dict-vendor-all = [
    "dict-airespace",
    "dict-aruba",
    "dict-ascend",
    "dict-cisco",
    "dict-eleven",
    "dict-fortinet",
    "dict-hp",
    "dict-juniper",
    "dict-meraki",
    "dict-microsoft",
    "dict-mikrotik",
    "dict-ruckus",
    "dict-tplink",
    "dict-wispr",
]

[build-dependencies]
radius-tokio-dict-codegen = { workspace = true }

[dev-dependencies]
radius-tokio-dict-codegen = { workspace = true }

[lints]
workspace = true
