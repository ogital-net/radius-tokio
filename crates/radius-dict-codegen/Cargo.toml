[package]
name = "radius-dict-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "FreeRADIUS dictionary parser and Rust code generator (build-time only)"
license = "BSD-2-Clause"
repository = "https://github.com/example/radius-tokio"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
dead_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
