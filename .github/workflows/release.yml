name: release

# Publishes every workspace member to crates.io when a `v<semver>` tag is
# pushed. All four crates share `workspace.package.version`, so a single
# tag fans out to one coordinated release.
#
# Required repository secret:
#   CARGO_REGISTRY_TOKEN   crates.io API token with publish scope for
#                          radius-tokio-dict-codegen, radius-tokio-dict,
#                          radius-tokio, radius-tokio-eap.
#
# Manual dry-run: trigger via `workflow_dispatch` with `dry_run=true` to
# package every crate without uploading.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package crates without uploading (cargo publish --dry-run)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: publish workspace
    runs-on: ubuntu-latest
    # Avoid concurrent releases racing the crates.io index.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys ssl is gated behind `radsec`, which is *not* a default
      # feature, so `cargo publish` (which builds with default features
      # only) does not need cmake/clang. We still install them because the
      # `cargo publish --dry-run` verify step compiles each crate, and
      # downstream consumers will hit these deps on first build.
      - name: Install build deps for aws-lc-sys (ssl)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Refuse to publish when the tag's version doesn't match the
      # workspace's declared version. Catches the "forgot to bump
      # Cargo.toml" foot-gun before any upload happens.
      - name: Verify tag matches workspace.package.version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ws_version=$(cargo metadata --format-version=1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); \
                          print(next(p['version'] for p in m['packages'] if p['name']=='radius-tokio'))")
          if [[ "$tag" != "$ws_version" ]]; then
            echo "::error::tag v$tag does not match workspace.package.version $ws_version"
            exit 1
          fi
          echo "Tag v$tag matches workspace version."

      - name: Determine publish flags
        id: flags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "extra=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      # Publish in dependency order. Each `cargo publish` waits for the
      # newly-uploaded version to appear on the sparse index before
      # returning, so downstream crates in the chain can resolve it.
      #
      # Order:
      #   1. radius-tokio-dict-codegen   (no internal deps)
      #   2. radius-tokio-dict           (build-dep on codegen)
      #   3. radius-tokio                (dep on dict)
      #   4. radius-tokio-eap            (dep on radius-tokio)
      # - name: Publish radius-tokio-dict-codegen
      #  env:
      #    CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #  run: cargo publish -p radius-tokio-dict-codegen --locked ${{ steps.flags.outputs.extra }}

      - name: Publish radius-tokio-dict
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radius-tokio-dict --locked ${{ steps.flags.outputs.extra }}

      - name: Publish radius-tokio
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radius-tokio --locked ${{ steps.flags.outputs.extra }}

      - name: Publish radius-tokio-eap
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radius-tokio-eap --locked ${{ steps.flags.outputs.extra }}

  # Create a GitHub Release pointing at the tag so changelog / artifacts
  # have a home. Skipped on workflow_dispatch (dry-runs don't get one).
  github_release:
    name: github release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file=$(mktemp)
          # Extract the section for this tag from CHANGELOG.md if present.
          # Looks for a heading like `## [0.1.0]` or `## 0.1.0`; falls back
          # to a generic message so the release always has a body.
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="${tag#v}" '
              $0 ~ "^## (\\[" ver "\\]|" ver ")" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            printf "Release %s\n" "$tag" > "$notes_file"
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$notes_file" \
            --verify-tag
